name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JS syntax
        run: |
          echo "Checking web/js/*.js ..."
          find web/js -name "*.js" -print0 | xargs -0 -I{} node --check {}
          echo "✓ All JS files parse cleanly"

      - name: Test SW version script
        run: |
          VERCEL_GIT_COMMIT_SHA="${{ github.sha }}" bash scripts/version-sw.sh
          grep -qE "stash-[a-f0-9]{7}" web/sw.js
          echo "✓ SW version script produces a correctly-formed cache key"

      - name: Check bookmarklet files are in sync
        run: |
          diff bookmarklet/install.html "ios/Eden/New Group/bookmarklet/install.html"
          diff bookmarklet/save-page.js "ios/Eden/New Group/bookmarklet/save-page.js"
          echo "✓ Bookmarklet files are identical in both locations"
